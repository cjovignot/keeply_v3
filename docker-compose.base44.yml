services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: keeeply
    volumes:
      - keeeply_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    init: true
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/keeeply
      VITE_API_URL: /api
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - keeeply_frontend_modules:/app/frontend/node_modules
      - keeeply_api_modules:/app/frontend/api/node_modules
    ports:
      - "3000:5173"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  keeeply_mongo_data:
  keeeply_frontend_modules:
  keeeply_api_modules:
